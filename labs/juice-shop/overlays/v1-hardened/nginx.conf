limit_req_zone $binary_remote_addr zone=lablogin:10m rate=1r/s;

server {
    listen 3000;
    server_name localhost;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    # Extra-file surface closed on this wall.
    location /ftp {
        deny all;
        return 403;
    }

    location /rest/user/login {
        limit_req zone=lablogin burst=3 nodelay;
        proxy_pass http://juice:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://juice:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
