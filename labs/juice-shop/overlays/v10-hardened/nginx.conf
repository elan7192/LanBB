worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 16;
}

http {
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    if_modified_since off;
    etag off;
    client_max_body_size 4k;
    client_body_timeout 1s;
    client_header_timeout 1s;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    keepalive_timeout 1s;
    lingering_timeout 1s;
    reset_timedout_connection on;
    gzip off;
    ssi off;
    autoindex off;
    underscores_in_headers off;
    ignore_invalid_headers on;
    max_ranges 0;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=labapi:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=labconn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # v10: broader signatures on path + query. Signatures only; no PoC.
    map $request_uri $lab_waf_block {
        default 0;
        ~*(?i)(union[[:space:]]+select|<script|javascript:|vbscript:|file://|[[:space:]]\.\./|information_schema|waitfor[[:space:]]+delay|onerror[[:space:]]*=|concat[[:space:]]*\(|sleep[[:space:]]*\(|extractvalue|load_file|benchmark[[:space:]]*\(|eval[[:space:]]*\(|pg_sleep|xml[[:space:]]*version|document\.cookie|updatexml|unhex|fromcharcode|alert[[:space:]]*\(|onload[[:space:]]*=|srcdoc|data:text/html|iframe|expression[[:space:]]*\(|innerhtml|document\.write|jndi:|__proto__|php://|%00|constructor\.prototype|\$\{|ldap://|gopher://|dict://|proc/self|function[[:space:]]*\(|child_process|require[[:space:]]*\(|\{\{|constructor\[|process\.env|Reflect\.|/etc/passwd|%2e%2e|Function[[:space:]]*\() 1;
    }

    server {
        listen 3000 default_server;
        server_name localhost 127.0.0.1;

        limit_conn labconn 1;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), fullscreen=(), interest-cohort=(), browsing-topics=(), display-capture=(), serial=(), hid=(), bluetooth=(), xr-spatial-tracking=(), autoplay=(), encrypted-media=(), midi=(), clipboard-read=(), clipboard-write=(), gamepad=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), idle-detection=(), otp-credentials=(), window-management=(), local-fonts=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header X-DNS-Prefetch-Control off always;
        add_header Cache-Control "no-store" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Download-Options noopen always;
        add_header X-XSS-Protection "0" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'none'; connect-src 'none'; img-src 'none'; style-src 'none'; font-src 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types default" always;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Set-Cookie;
        proxy_cookie_flags ~ httponly secure samesite=strict;
        proxy_read_timeout 2s;
        proxy_send_timeout 2s;
        proxy_connect_timeout 1s;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;

        if ($host !~ ^(127\.0\.0\.1|localhost)$) {
            return 444;
        }
        if ($request_method ~* ^(TRACE|TRACK|CONNECT|OPTIONS|POST|PUT|PATCH|DELETE|HEAD)$) {
            return 405;
        }
        if ($request_method !~ ^(GET)$) {
            return 405;
        }

        # Score harness: exact GET /api/Challenges/ only (trailing slash).
        # v9 also proxied /api/Challenges without slash. Do not mix /snippets.
        location = /api/Challenges {
            deny all;
            return 403;
        }
        location = /api/Challenges/ {
            limit_req zone=labapi burst=1 nodelay;
            limit_except GET {
                deny all;
            }
            if ($is_args) {
                return 403;
            }
            if ($http_cookie) {
                return 403;
            }
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_hide_header X-Powered-By;
            proxy_hide_header Set-Cookie;
        }

