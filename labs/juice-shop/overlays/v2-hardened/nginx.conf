worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 1m;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=lablogin:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=labapi:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=labsearch:10m rate=2r/s;

    map $args $lab_waf_block {
        default 0;
        ~*(?i)(union[[:space:]]+select|<script|javascript:|file://|[[:space:]]\.\./) 1;
    }

    server {
        listen 3000;
        server_name localhost;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

        if ($request_method = TRACE) {
            return 405;
        }

        # Score harness: GET /api/Challenges/ stays open. Do not mix /snippets.
        location /api/Challenges {
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        # v1 controls kept: extra-file /ftp closed.
        location /ftp {
            deny all;
            return 403;
        }

        # New class vs v1: crypto-key dump, metrics, support dumps, open redirect, admin API.
        location /encryptionkeys {
            deny all;
            return 403;
        }
        location /metrics {
            deny all;
            return 403;
        }
        location /support {
            deny all;
            return 403;
        }
        location /redirect {
            deny all;
            return 403;
        }
        location /rest/admin {
            deny all;
            return 403;
        }

        # Auth-ish: user listing is closed at the edge; registration POST still allowed.
        location = /api/Users {
            limit_req zone=lablogin burst=2 nodelay;
            limit_except POST OPTIONS {
                deny all;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }
        location = /api/Users/ {
            limit_req zone=lablogin burst=2 nodelay;
            limit_except POST OPTIONS {
                deny all;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location /rest/user/login {
            limit_req zone=lablogin burst=2 nodelay;
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location /rest/user/reset-password {
            limit_req zone=lablogin burst=2 nodelay;
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location /rest/products/search {
            limit_req zone=labsearch burst=4 nodelay;
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location / {
            limit_req zone=labapi burst=10 nodelay;
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }
    }
}
