worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_max_body_size 128k;
    client_body_timeout 8s;
    client_header_timeout 8s;
    client_body_buffer_size 16k;
    large_client_header_buffers 4 8k;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=lablogin:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=labapi:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=labsearch:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=labconn:10m;

    # v4: broader signatures on path + query. Signatures only; no PoC.
    map $request_uri $lab_waf_block {
        default 0;
        ~*(?i)(union[[:space:]]+select|<script|javascript:|file://|[[:space:]]\.\./|information_schema|waitfor[[:space:]]+delay|onerror[[:space:]]*=|concat[[:space:]]*\(|sleep[[:space:]]*\(|extractvalue|load_file|benchmark[[:space:]]*\() 1;
    }

    server {
        listen 3000;
        server_name localhost;

        limit_conn labconn 8;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), fullscreen=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header X-DNS-Prefetch-Control off always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cookie_flags ~ httponly secure samesite=strict;

        if ($request_method ~* ^(TRACE|TRACK|CONNECT)$) {
            return 405;
        }
        if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
            return 405;
        }

        # Score harness: GET /api/Challenges/ stays open. Do not mix /snippets.
        location /api/Challenges {
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        # v1/v2/v3 controls kept.
        location /ftp {
            deny all;
            return 403;
        }
        location /encryptionkeys {
            deny all;
            return 403;
        }
        location /metrics {
            deny all;
            return 403;
        }
        location /support {
            deny all;
            return 403;
        }
        location /redirect {
            deny all;
            return 403;
        }
        location /rest/admin {
            deny all;
            return 403;
        }
        location /file-upload {
            deny all;
            return 403;
        }
        location /profile {
            deny all;
            return 403;
        }
        location /video {
            deny all;
            return 403;
        }
        location /b2b {
            deny all;
            return 403;
        }
        location /snippets {
            deny all;
            return 403;
        }
        location /socket.io {
            deny all;
            return 403;
        }
        location /rest/chatbot {
            deny all;
            return 403;
        }
        location /rest/track-order {
            deny all;
            return 403;
        }
        location /rest/continue-code {
            deny all;
            return 403;
        }
        location /rest/wallet {
            deny all;
            return 403;
        }
        location /rest/2fa {
            deny all;
            return 403;
        }
        location /dataerasure {
            deny all;
            return 403;
        }
        location /rest/memories {
            deny all;
            return 403;
        }
        location /rest/deluxe-membership {
            deny all;
            return 403;
        }
        location /api/Cards {
            deny all;
            return 403;
        }
        location /api/Addresss {
            deny all;
            return 403;
        }
        location /api/SecurityQuestions {
            deny all;
            return 403;
        }
        location /rest/saveLoginIp {
            deny all;
            return 403;
        }
        location /rest/order-history {
            deny all;
            return 403;
        }

        # New class vs v3: GraphQL, basket/commerce, reviews/feedback, captcha, data-export.
        location /graphql {
            deny all;
            return 403;
        }
        location /api/graphql {
            deny all;
            return 403;
        }
        location /api/BasketItems {
            deny all;
            return 403;
        }
        location /rest/basket {
            deny all;
            return 403;
        }
        location /api/Quantitys {
            deny all;
            return 403;
        }
        location /api/Deliverys {
            deny all;
            return 403;
        }
        location /api/Recycles {
            deny all;
            return 403;
        }
        location /api/Feedbacks {
            deny all;
            return 403;
        }
        location /api/Complaints {
            deny all;
            return 403;
        }
        location /rest/products/reviews {
            deny all;
            return 403;
        }
        location /rest/captcha {
            deny all;
            return 403;
        }
        location /rest/image-captcha {
            deny all;
            return 403;
        }
        location /rest/user/data-export {
            deny all;
            return 403;
        }
        location /rest/user/change-password {
            deny all;
            return 403;
        }
        location /api/SecurityAnswers {
            deny all;
            return 403;
        }
        location /api/PrivacyRequests {
            deny all;
            return 403;
        }

        # Auth-ish: user listing is closed at the edge; registration POST still allowed.
        location = /api/Users {
            limit_req zone=lablogin burst=0 nodelay;
            limit_except POST OPTIONS {
                deny all;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }
        location = /api/Users/ {
            limit_req zone=lablogin burst=0 nodelay;
            limit_except POST OPTIONS {
                deny all;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location /rest/user/login {
            limit_req zone=lablogin burst=0 nodelay;
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location /rest/user/reset-password {
            limit_req zone=lablogin burst=0 nodelay;
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location /rest/products/search {
            limit_req zone=labsearch burst=1 nodelay;
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location / {
            limit_req zone=labapi burst=3 nodelay;
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }
    }
}
