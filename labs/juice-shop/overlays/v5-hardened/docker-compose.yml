services:
  juice:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 384m
    pids_limit: 128
    cpus: "1.0"
    read_only: true
    tmpfs:
      - /tmp
      - /juice-shop/data
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "4m"
        max-file: "2"
  edge:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 32m
    pids_limit: 32
    cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
