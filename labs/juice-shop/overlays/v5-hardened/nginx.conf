worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    client_max_body_size 64k;
    client_body_timeout 6s;
    client_header_timeout 6s;
    client_body_buffer_size 8k;
    large_client_header_buffers 2 4k;
    keepalive_timeout 5s;
    reset_timedout_connection on;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=lablogin:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=labapi:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=labconn:10m;

    # v5: broader signatures on path + query. Signatures only; no PoC.
    map $request_uri $lab_waf_block {
        default 0;
        ~*(?i)(union[[:space:]]+select|<script|javascript:|file://|[[:space:]]\.\./|information_schema|waitfor[[:space:]]+delay|onerror[[:space:]]*=|concat[[:space:]]*\(|sleep[[:space:]]*\(|extractvalue|load_file|benchmark[[:space:]]*\(|eval[[:space:]]*\(|pg_sleep|xml[[:space:]]*version|document\.cookie) 1;
    }

    server {
        listen 3000;
        server_name localhost;

        limit_conn labconn 4;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), fullscreen=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header X-DNS-Prefetch-Control off always;
        add_header Cache-Control "no-store" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; require-trusted-types-for 'script'" always;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cookie_flags ~ httponly secure samesite=strict;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_connect_timeout 5s;

        if ($request_method ~* ^(TRACE|TRACK|CONNECT|OPTIONS)$) {
            return 405;
        }
        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
        }

        # Score harness: GET /api/Challenges/ stays open. Do not mix /snippets.
        location /api/Challenges {
            limit_except GET HEAD {
                deny all;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        # v1–v4 controls kept.
        location /ftp {
            deny all;
            return 403;
        }
        location /encryptionkeys {
            deny all;
            return 403;
        }
        location /metrics {
            deny all;
            return 403;
        }
        location /support {
            deny all;
            return 403;
        }
        location /redirect {
            deny all;
            return 403;
        }
        location /rest/admin {
            deny all;
            return 403;
        }
        location /file-upload {
            deny all;
            return 403;
        }
        location /profile {
            deny all;
            return 403;
        }
        location /video {
            deny all;
            return 403;
        }
        location /b2b {
            deny all;
            return 403;
        }
        location /snippets {
            deny all;
            return 403;
        }
        location /socket.io {
            deny all;
            return 403;
        }
        location /rest/chatbot {
            deny all;
            return 403;
        }
        location /rest/track-order {
            deny all;
            return 403;
        }
        location /rest/continue-code {
            deny all;
            return 403;
        }
        location /rest/wallet {
            deny all;
            return 403;
        }
        location /rest/2fa {
            deny all;
            return 403;
        }
        location /dataerasure {
            deny all;
            return 403;
        }
        location /rest/memories {
            deny all;
            return 403;
        }
        location /rest/deluxe-membership {
            deny all;
            return 403;
        }
        location /api/Cards {
            deny all;
            return 403;
        }
        location /api/Addresss {
            deny all;
            return 403;
        }
        location /api/SecurityQuestions {
            deny all;
            return 403;
        }
        location /rest/saveLoginIp {
            deny all;
            return 403;
        }
        location /rest/order-history {
            deny all;
            return 403;
        }
        location /graphql {
            deny all;
            return 403;
        }
        location /api/graphql {
            deny all;
            return 403;
        }
        location /api/BasketItems {
            deny all;
            return 403;
        }
        location /rest/basket {
            deny all;
            return 403;
        }
        location /api/Quantitys {
            deny all;
            return 403;
        }
        location /api/Deliverys {
            deny all;
            return 403;
        }
        location /api/Recycles {
            deny all;
            return 403;
        }
        location /api/Feedbacks {
            deny all;
            return 403;
        }
        location /api/Complaints {
            deny all;
            return 403;
        }
        location /rest/products/reviews {
            deny all;
            return 403;
        }
        location /rest/captcha {
            deny all;
            return 403;
        }
        location /rest/image-captcha {
            deny all;
            return 403;
        }
        location /rest/user/data-export {
            deny all;
            return 403;
        }
        location /rest/user/change-password {
            deny all;
            return 403;
        }
        location /api/SecurityAnswers {
            deny all;
            return 403;
        }
        location /api/PrivacyRequests {
            deny all;
            return 403;
        }

        # New class vs v4: registration, reset, whoami/session, OAuth,
        # Web3/NFT, catalog/search, hints/swagger/robots, leftover info-leak APIs.
        location /api/Users {
            deny all;
            return 403;
        }
        location /rest/user/reset-password {
            deny all;
            return 403;
        }
        location /rest/user/whoami {
            deny all;
            return 403;
        }
        location /rest/user/authentication-details {
            deny all;
            return 403;
        }
        location /rest/user/oauth {
            deny all;
            return 403;
        }
        location /rest/web3 {
            deny all;
            return 403;
        }
        location /nft {
            deny all;
            return 403;
        }
        location /api/Hints {
            deny all;
            return 403;
        }
        location /api/Products {
            deny all;
            return 403;
        }
        location /rest/products {
            deny all;
            return 403;
        }
        location /api-docs {
            deny all;
            return 403;
        }
        location /swagger {
            deny all;
            return 403;
        }
        location = /robots.txt {
            deny all;
            return 403;
        }
        location = /security.txt {
            deny all;
            return 403;
        }
        location /.well-known {
            deny all;
            return 403;
        }
        location /promotion {
            deny all;
            return 403;
        }
        location /rest/repeat-notification {
            deny all;
            return 403;
        }
        location /rest/country-mapping {
            deny all;
            return 403;
        }
        location /rest/languages {
            deny all;
            return 403;
        }
        location /assets/public/images/uploads {
            deny all;
            return 403;
        }

        # Remaining auth door: login, now behind WAF-ish signatures (v4 did not).
        location /rest/user/login {
            limit_req zone=lablogin burst=1 nodelay;
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        location / {
            limit_req zone=labapi burst=1 nodelay;
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }
    }
}
