services:
  juice:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 96
    cpus: "0.75"
    # Working harden: juice root stays writable. v5 read_only EROFS-skipped .well-known/csaf.
    # Do not tmpfs /juice-shop/data — that hides data/static so the wall does not apply.
    tmpfs:
      - /tmp:size=16m
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
  edge:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m
      - /var/run:size=4m
      - /tmp:size=8m
      - /var/log/nginx:size=4m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 24m
    pids_limit: 24
    cpus: "0.20"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
