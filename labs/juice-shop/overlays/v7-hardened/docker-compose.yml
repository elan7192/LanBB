services:
  juice:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 192m
    pids_limit: 64
    cpus: "0.50"
    # Working harden that actually applies (Fill on v6: EROFS_GONE, ReadonlyRootfs=false).
    # Juice root stays writable. Do not set read_only. v5 EROFS-skipped .well-known/csaf.
    # tmpfs=/tmp only. Do not tmpfs /juice-shop/data — that hides data/static.
    tmpfs:
      - /tmp:size=8m
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
  edge:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=4m
      - /var/run:size=2m
      - /tmp:size=4m
      - /var/log/nginx:size=2m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 16m
    pids_limit: 16
    cpus: "0.15"
    logging:
      driver: json-file
      options:
        max-size: "512k"
        max-file: "2"
