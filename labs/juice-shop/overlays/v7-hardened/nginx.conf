worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    if_modified_since off;
    client_max_body_size 16k;
    client_body_timeout 3s;
    client_header_timeout 3s;
    client_body_buffer_size 2k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    keepalive_timeout 2s;
    reset_timedout_connection on;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=labapi:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=labconn:10m;

    # v7: broader signatures on path + query. Signatures only; no PoC.
    map $request_uri $lab_waf_block {
        default 0;
        ~*(?i)(union[[:space:]]+select|<script|javascript:|vbscript:|file://|[[:space:]]\.\./|information_schema|waitfor[[:space:]]+delay|onerror[[:space:]]*=|concat[[:space:]]*\(|sleep[[:space:]]*\(|extractvalue|load_file|benchmark[[:space:]]*\(|eval[[:space:]]*\(|pg_sleep|xml[[:space:]]*version|document\.cookie|updatexml|unhex|fromcharcode|alert[[:space:]]*\(|onload[[:space:]]*=|srcdoc|data:text/html|iframe|expression[[:space:]]*\(|innerhtml|document\.write) 1;
    }

    server {
        listen 3000;
        server_name localhost;

        limit_conn labconn 1;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), accelerometer=(), gyroscope=(), fullscreen=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Permitted-Cross-Domain-Policies none always;
        add_header X-DNS-Prefetch-Control off always;
        add_header Cache-Control "no-store" always;
        add_header Origin-Agent-Cluster "?1" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Download-Options noopen always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types default" always;

        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_cookie_flags ~ httponly secure samesite=strict;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
        proxy_connect_timeout 2s;

        if ($request_method ~* ^(TRACE|TRACK|CONNECT|OPTIONS|POST|PUT|PATCH|DELETE)$) {
            return 405;
        }
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }

        # Score harness: GET /api/Challenges/ stays the only proxied path. Do not mix /snippets.
        location /api/Challenges {
            limit_req zone=labapi burst=1 nodelay;
            limit_except GET HEAD {
                deny all;
            }
            if ($lab_waf_block) {
                return 403;
            }
            proxy_pass http://juice:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_hide_header X-Powered-By;
        }

        # v1–v6 controls kept.
        location /ftp {
            deny all;
            return 403;
        }
        location /encryptionkeys {
            deny all;
            return 403;
        }
        location /metrics {
            deny all;
            return 403;
