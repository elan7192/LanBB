        # New class vs v6: remaining REST/API namespaces, SPA shell, leftover
        # frontend routes, root JS/CSS/ico leak. Default-deny unmatched GET/HEAD.
        location /rest {
            deny all;
            return 403;
        }
        location /api {
            deny all;
            return 403;
        }
        location = / {
            deny all;
