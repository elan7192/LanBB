services:
  juice:
    image: bkimminich/juice-shop@sha256:73c53fbf442e8337b3ea3d98c7e8550308854701ebdfce4cc39768f36b75430e
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 48
    cpus: "0.35"
    ulimits:
      nproc: 48
      nofile: 256
    # Working harden that actually applies (Fill on v7: GET /api/Challenges/ 200,
    # default-deny 403, POST 405; EROFS_GONE, ReadonlyRootfs=false).
    # Juice root stays writable. Do not set read_only. v5 EROFS-skipped .well-known/csaf.
    # tmpfs=/tmp only. Do not tmpfs /juice-shop/data — that hides data/static.
    tmpfs:
      - /tmp:size=4m
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "512k"
        max-file: "2"
  edge:
    image: nginx:alpine
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - juice
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=2m
      - /var/run:size=1m
      - /tmp:size=2m
      - /var/log/nginx:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 12m
    pids_limit: 12
    cpus: "0.10"
    logging:
      driver: json-file
      options:
        max-size: "256k"
        max-file: "2"
